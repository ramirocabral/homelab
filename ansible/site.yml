---
# k3s cluster bring-up. Order matters: prep every node, hand the iGPU nodes their
# drivers, prepare storage on the workers, stand up the server, join the agents,
# and label them last, once the API is up. The CNI (Cilium) and the rest of the
# add-ons are installed afterwards via Helm (see the README), not here.

- name: Common node preparation
  hosts: k3s_cluster
  tags: common
  pre_tasks:
    # Freshly cloned VMs may still be finishing cloud-init when Terraform hands
    # off, so wait for SSH before the first task instead of failing "unreachable".
    - name: Wait for SSH to come up
      ansible.builtin.wait_for_connection:
        timeout: 300
  roles:
    - common

- name: Intel iGPU nodes
  hosts: agent
  roles:
    - role: gpu
      when: igpu | bool

- name: Longhorn storage prerequisites (nodes with a data disk)
  hosts: agent
  tags: storage
  roles:
    - role: storage
      when: longhorn_data | bool

- name: k3s control-plane (server)
  hosts: server
  roles:
    - k3s_server

- name: k3s workers (agents)
  hosts: agent
  roles:
    - k3s_agent

- name: Node labels
  hosts: k3s_cluster
  tags: labels
  roles:
    - k3s_labels
