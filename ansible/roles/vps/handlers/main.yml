---
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart wireguard
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: restarted

- name: Restart gatus
  ansible.builtin.systemd_service:
    name: gatus
    state: restarted
    daemon_reload: true

- name: Restart node-exporter
  ansible.builtin.systemd_service:
    name: node-exporter
    state: restarted
    daemon_reload: true
