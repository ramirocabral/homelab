---
- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart npm
  ansible.builtin.systemd_service:
    name: npm
    state: restarted
    daemon_reload: true
