---
- name: Install Longhorn node dependencies
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true

- name: Enable iscsid
  ansible.builtin.service:
    name: iscsid
    enabled: true
    state: started

- name: Load iscsi_tcp on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/iscsi.conf
    content: "iscsi_tcp\n"
    mode: "0644"

- name: Ensure iscsi_tcp is loaded now
  community.general.modprobe:
    name: iscsi_tcp
    state: present

- name: Resolve the data disk behind its stable by-id path
  ansible.builtin.command: "readlink -f {{ longhorn_device }}"
  register: longhorn_disk
  changed_when: false

- name: Refuse to touch a partitioned disk
  ansible.builtin.assert:
    that: ansible_devices[longhorn_disk.stdout | basename].partitions | length == 0
    fail_msg: >-
      {{ longhorn_device }} resolves to {{ longhorn_disk.stdout }}, which is partitioned.
      That is not the empty scsi1 data disk, and formatting it would destroy the node.

- name: Create ext4 filesystem on the Longhorn data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ longhorn_device }}"
    force: false

- name: Get UUID of the Longhorn data disk
  ansible.builtin.command: "blkid -s UUID -o value {{ longhorn_device }}"
  register: longhorn_uuid
  changed_when: false

- name: Mount the Longhorn data disk by UUID
  ansible.posix.mount:
    path: "{{ longhorn_data_dir }}"
    src: "UUID={{ longhorn_uuid.stdout }}"
    fstype: ext4
    opts: defaults,discard
    state: mounted
